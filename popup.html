<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Autofill</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Job Autofill</h1>
    <p class="hint">Fill once, reuse everywhere. Leave blank to skip.</p>
  </header>

  <form id="profileForm"></form>

  <details class="section">
    <summary>Job sites</summary>
    <div class="section-body">
      <textarea id="sitesList" rows="4" placeholder="https://jobs.lever.co/yourcompany&#10;https://boards.greenhouse.io/yourcompany"></textarea>
      <div class="row">
        <button id="saveSites" type="button" class="secondary">Save sites</button>
        <span id="saveSitesStatus" class="status"></span>
      </div>
      <button id="openAll" type="button" class="secondary full">Open all &amp; autofill</button>
      <p class="hint">Opens each in a background tab and autofills it. You still review and hit submit yourself.</p>
    </div>
  </details>

  <details class="section">
    <summary>Trained mappings</summary>
    <div class="section-body">
      <p id="trainedInfo" class="hint"></p>
      <button id="clearTrained" type="button" class="danger full">Clear trained mappings</button>
    </div>
  </details>

  <div class="actionbar">
    <button id="runHere" type="button" class="secondary">Run on this tab</button>
    <button id="save" type="button">Save profile</button>
  </div>
  <div class="status" id="saveStatus"></div>
  <div class="status" id="runStatus"></div>

  <script src="fieldMap.js"></script>
  <script src="popup.js"></script>
</body>
</html>
